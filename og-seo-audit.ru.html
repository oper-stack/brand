<!doctype html><html lang="ru"><head><meta charset="utf-8">
<!--
  Русская карточка аудита. Шаблона у неё не было на диске: до 18.09.2026 существовал только
  готовый PNG, и поменять в нём текст было нельзя. Отличия от английской ровно два: шрифты с
  кириллицей (Fraunces и DM Sans её не знают) и плашка с ценой, как на прежней карточке.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0B1017; color: #F5F2EC; font-family: Inter, system-ui, sans-serif; position: relative; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(61,184,169,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(61,184,169,.08) 1px, transparent 1px); background-size: 60px 60px; }
  .glow { position: absolute; right: -120px; top: -160px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle, rgba(61,184,169,.35), transparent 62%); }
  .wrap { position: absolute; left: 80px; top: 72px; right: 80px; bottom: 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .mark { width: 64px; height: 64px; border-radius: 14px; background: #F5F2EC; position: relative; }
  .mark i { position: absolute; left: 16px; height: 5px; border-radius: 3px; background: #1A8A7D; }
  .mark i:nth-child(1) { top: 42px; width: 32px; } .mark i:nth-child(2) { top: 30px; width: 24px; left: 20px; } .mark i:nth-child(3) { top: 18px; width: 16px; left: 24px; }
  .mark b { position: absolute; right: 12px; top: 16px; width: 8px; height: 8px; border-radius: 50%; background: #C9922A; }
  .name { font-family: "Playfair Display", Georgia, serif; font-size: 40px; font-weight: 700; letter-spacing: -.5px; }
  .name span { color: #3DB8A9; }
  .price { display: inline-block; background: #E8B84A; color: #18202B; font-size: 26px; font-weight: 600; padding: 10px 24px; border-radius: 999px; letter-spacing: .01em; }
  h1 { font-family: "Playfair Display", Georgia, serif; font-size: 62px; line-height: 1.08; font-weight: 700; margin: 20px 0 0; max-width: 980px; letter-spacing: -.5px; }
  p { font-size: 26px; color: #B8C0C8; margin: 20px 0 0; max-width: 900px; line-height: 1.35; }
  .foot { display: flex; justify-content: space-between; font-size: 22px; color: #8B939E; letter-spacing: .04em; }
  .foot code { font-family: "JetBrains Mono", Menlo, monospace; color: #E8B84A; }
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="brand"><div class="mark"><i></i><i></i><i></i><b></b></div><div class="name">Oper<span>Stack</span></div></div>
  <div>
    <span class="price">12 500 ₽</span>
    <h1>Почему вас не показывают в ИИ и в поиске</h1>
    <p>Сто страниц вашего сайта, пять конкурентов рядом и три готовых файла. Отчёт приходит за несколько минут.</p>
  </div>
  <div class="foot"><span>oper-stack.ru</span><code>oper-stack.ru/produkty/seo-audit</code></div>
</div>
</body></html>
