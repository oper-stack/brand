<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
  html, body { margin: 0; width: 1584px; height: 396px; overflow: hidden; }
  body { background: #0B1017; color: #F5F2EC; font-family: "DM Sans", system-ui, sans-serif; position: relative; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(61,184,169,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(61,184,169,.08) 1px, transparent 1px); background-size: 48px 48px; }
  .glow { position: absolute; right: -140px; top: -260px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle, rgba(61,184,169,.32), transparent 62%); }
  /* LinkedIn hides the bottom-left area behind the avatar: keep the left 420px empty */
  .wrap { position: absolute; left: 440px; right: 72px; top: 56px; bottom: 48px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .mark { width: 52px; height: 52px; border-radius: 12px; background: #F5F2EC; position: relative; }
  .mark i { position: absolute; left: 13px; height: 4px; border-radius: 2px; background: #1A8A7D; }
  .mark i:nth-child(1) { top: 34px; width: 26px; } .mark i:nth-child(2) { top: 24px; width: 20px; left: 16px; } .mark i:nth-child(3) { top: 14px; width: 13px; left: 19px; }
  .mark b { position: absolute; right: 10px; top: 12px; width: 7px; height: 7px; border-radius: 50%; background: #C9922A; }
  .name { font-family: Fraunces, Georgia, serif; font-size: 34px; font-weight: 600; letter-spacing: -.3px; } .name span { color: #3DB8A9; }
  h1 { font-family: Fraunces, Georgia, serif; font-size: 50px; line-height: 1.08; font-weight: 600; margin: 0; max-width: 980px; letter-spacing: -.6px; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; font-size: 21px; color: #B8C0C8; }
  .foot code { font-family: "JetBrains Mono", Menlo, monospace; color: #E8B84A; font-size: 22px; }
</style></head><body><div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="brand"><div class="mark"><i></i><i></i><i></i><b></b></div><div class="name">Oper<span>Stack</span></div></div>
  <h1>Tools for content sites that have to rank, be cited by AI and convert.</h1>
  <div class="foot"><span>Built while running 11 content sites for MORE Group, Phuket</span><code>npx @operstack/gates</code></div>
</div></body></html>
